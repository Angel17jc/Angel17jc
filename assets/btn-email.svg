<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" width="220" height="52"
     role="img" aria-label="Email">
  <title>Email</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0909"/>
      <stop offset="1" stop-color="#0a0404"/>
    </linearGradient>
    <!-- barrido de brillo del texto, como en el nombre -->
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="-60" y2="0">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#ffffff"/>
      <stop offset="0.5"  stop-color="#ff7a7a"/>
      <stop offset="0.58" stop-color="#ffffff"/>
      <stop offset="1"    stop-color="#ffffff"/>
      <animate attributeName="x1" from="-200" to="220" dur="3.6s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="-60"  to="360" dur="3.6s" begin="0s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="218" height="50" rx="10" fill="url(#bg)"/>

  <!-- borde base que se enciende con la descarga de 12s -->
  <rect x="1" y="1" width="218" height="50" rx="10" fill="none" stroke="#5a1414" stroke-width="1.5">
    <animate attributeName="stroke" values="#5a1414;#ff4040;#5a1414;#5a1414"
             keyTimes="0;.015;.12;1" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- luz que recorre el borde -->
  <rect x="1" y="1" width="218" height="50" rx="10" fill="none" stroke="#ff4d4d"
        stroke-width="2" pathLength="100" stroke-dasharray="16 84" stroke-linecap="round"
        filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="100" dur="3.6s"
             begin="0s" repeatCount="indefinite"/>
  </rect>

  <!-- icono -->
  <g transform="translate(22 14)" filter="url(#glow)">
    <animate attributeName="opacity" values=".75;1;.75" dur="3.4s" repeatCount="indefinite"/>
    <rect x="0" y="3" width="30" height="20" rx="3" fill="none" stroke="#ff4d4d" stroke-width="2"/>
    <path d="M1.5 5 L15 15 L28.5 5" fill="none" stroke="#ff4d4d" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <text x="66" y="32" font-family="Verdana,DejaVu Sans,sans-serif" font-size="15"
        font-weight="bold" letter-spacing="2" fill="url(#shine)">EMAIL</text>

  <!-- flecha que empuja hacia afuera -->
  <path d="M190 20 l6 6 l-6 6" fill="none" stroke="#ff4d4d" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate"
                      values="0,0; 4,0; 0,0" dur="1.6s"
                      calcMode="spline" keyTimes="0;0.5;1"
                      keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
  </path>
</svg>
