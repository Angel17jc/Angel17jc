<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 28" width="1000" height="28"
     role="img" aria-label="divider">
  <title>divider</title>
  <defs>
    <!-- base line: strong in the center, fading towards the edges -->
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ff2f2f" stop-opacity="0"/>
      <stop offset=".5"  stop-color="#ff2f2f" stop-opacity=".55"/>
      <stop offset="1"   stop-color="#ff2f2f" stop-opacity="0"/>
    </linearGradient>

    <!-- energy pulses: bright head, fading tail -->
    <linearGradient id="pulseL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ff2f2f" stop-opacity="0"/>
      <stop offset=".85" stop-color="#ff6b6b" stop-opacity=".9"/>
      <stop offset="1"   stop-color="#fff0f0" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="pulseR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0"   stop-color="#ff2f2f" stop-opacity="0"/>
      <stop offset=".85" stop-color="#ff6b6b" stop-opacity=".9"/>
      <stop offset="1"   stop-color="#fff0f0" stop-opacity="1"/>
    </linearGradient>

    <filter id="soft" x="-50%" y="-300%" width="200%" height="700%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="13.5" width="1000" height="1" fill="url(#base)"/>

  <!-- two pulses travel in from the edges and collide in the center every 6s -->
  <g filter="url(#glow)">
    <rect x="-220" y="12.5" width="220" height="3" fill="url(#pulseL)" opacity="0">
      <animate attributeName="x" values="-220;-220;270;270" keyTimes="0;.05;.5;1"
               calcMode="spline" keySplines="0 0 1 1;.5 0 .9 .6;0 0 1 1"
               dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.1;.49;.52;1"
               dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="1000" y="12.5" width="220" height="3" fill="url(#pulseR)" opacity="0">
      <animate attributeName="x" values="1000;1000;510;510" keyTimes="0;.05;.5;1"
               calcMode="spline" keySplines="0 0 1 1;.5 0 .9 .6;0 0 1 1"
               dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.1;.49;.52;1"
               dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- wave opening from the center when the pulses collide -->
  <rect x="500" y="13" width="0" height="2" fill="#ff6b6b" opacity="0" filter="url(#glow)">
    <animate attributeName="width" values="0;0;380;380" keyTimes="0;.5;.75;1"
             dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="500;500;310;310" keyTimes="0;.5;.75;1"
             dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;.8;0;0" keyTimes="0;.5;.52;.75;1"
             dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- center diamond: background glow + spinning frame + pulsing core -->
  <g transform="translate(500 14)">
    <rect x="-10" y="-10" width="20" height="20" fill="#ff1e1e" filter="url(#soft)"
          transform="rotate(45)" opacity=".3">
      <animate attributeName="opacity" values=".3;.3;1;.3;.3" keyTimes="0;.5;.53;.7;1"
               dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="-8" y="-8" width="16" height="16" fill="none" stroke="#ff2f2f"
          stroke-width="1.2" opacity=".75">
      <animateTransform attributeName="transform" type="rotate"
                        from="45" to="405" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="-4" y="-4" width="8" height="8" fill="#ff2f2f" transform="rotate(45)">
      <animate attributeName="fill" values="#ff2f2f;#ff2f2f;#fff0f0;#ff2f2f;#ff2f2f"
               keyTimes="0;.5;.52;.62;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
