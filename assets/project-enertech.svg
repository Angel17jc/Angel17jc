<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 230" width="440" height="230"
     role="img" aria-label="Enertech - Energy consumption tracker with savings goals, cost calculation and personalized tips. Bilingual, keyboard and screen reader friendly.">
  <title>Enertech</title>
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="440" height="230" rx="14"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160707"/>
      <stop offset="1" stop-color="#060202"/>
    </linearGradient>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff2b2b" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- shine sweep over the project name, same as the name -->
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="-60" y2="0">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#ffffff"/>
      <stop offset="0.5"  stop-color="#ff7a7a"/>
      <stop offset="0.58" stop-color="#ffffff"/>
      <stop offset="1"    stop-color="#ffffff"/>
      <animate attributeName="x1" from="-260" to="440" dur="4.5s" begin="-1.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="-60" to="640" dur="4.5s" begin="-1.8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text  { font-family: Verdana, 'DejaVu Sans', sans-serif; }
    .name { font-size: 21px; font-weight: bold; letter-spacing: 1px; }
    .desc { fill: #c9b8b8; font-size: 12.5px; }
    .chip { fill: #ff8a8a; font-size: 11px; }
    .tag  { fill: #ff6b6b; font-size: 10px; font-weight: bold; letter-spacing: 1px; }
    .cta  { fill: #e8dada; font-size: 11.5px; font-weight: bold; letter-spacing: 1px; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="440" height="230" fill="url(#bg)"/>

    <!-- ember pulsing in the corner -->
    <ellipse cx="440" cy="0" rx="240" ry="170" fill="url(#ember)">
      <animate attributeName="opacity" values=".45;1;.45" dur="3.4s" begin="-1.8s" repeatCount="indefinite"/>
    </ellipse>

    <!-- diamond + name -->
    <g transform="translate(33 47) rotate(45)">
      <rect x="-5" y="-5" width="10" height="10" fill="#ff2f2f" filter="url(#glow)">
        <animateTransform attributeName="transform" type="scale"
                          values="1;1.2;1" dur="3.4s" begin="-1.8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="50" y="55" class="name" fill="url(#shine)" filter="url(#glow)">Enertech</text>

    <!-- tag in the top right corner -->
    <rect x="328" y="36" width="88" height="20" rx="4" fill="none" stroke="#ff2f2f" stroke-opacity=".6"/>
    <text x="372.0" y="50" text-anchor="middle" class="tag">WCAG 2.2 AA</text>

    <!-- underline that draws in and out -->
    <rect x="26" y="68" width="0" height="2" fill="#ff2f2f">
      <animate attributeName="width" values="0;150;150;0" keyTimes="0;.35;.8;1"
               dur="6s" begin="-1.8s" repeatCount="indefinite"/>
    </rect>

    <text x="26" y="92" class="desc">Energy consumption tracker with savings goals,</text>
    <text x="26" y="112" class="desc">cost calculation and personalized tips. Bilingual,</text>
    <text x="26" y="132" class="desc">keyboard and screen reader friendly.</text>

    <!-- tech chips come in one by one -->
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.400;1" dur="0.75s" fill="freeze"/>
      <rect x="26" y="160" width="52" height="22" rx="11" fill="#1c0808" stroke="#7a1414"/>
      <text x="52.0" y="175" text-anchor="middle" class="chip">React</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.471;1" dur="0.85s" fill="freeze"/>
      <rect x="84" y="160" width="87" height="22" rx="11" fill="#1c0808" stroke="#7a1414"/>
      <text x="127.5" y="175" text-anchor="middle" class="chip">TypeScript</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.526;1" dur="0.95s" fill="freeze"/>
      <rect x="177" y="160" width="73" height="22" rx="11" fill="#1c0808" stroke="#7a1414"/>
      <text x="213.5" y="175" text-anchor="middle" class="chip">Supabase</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.571;1" dur="1.05s" fill="freeze"/>
      <rect x="256" y="160" width="73" height="22" rx="11" fill="#1c0808" stroke="#7a1414"/>
      <text x="292.5" y="175" text-anchor="middle" class="chip">Recharts</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.609;1" dur="1.15s" fill="freeze"/>
      <rect x="335" y="160" width="73" height="22" rx="11" fill="#1c0808" stroke="#7a1414"/>
      <text x="371.5" y="175" text-anchor="middle" class="chip">Tailwind</text>
    </g>

    <!-- call to action with an arrow nudging outwards -->
    <text x="396" y="210" text-anchor="end" class="cta">VIEW REPO</text>
    <path d="M404 201 l5 5 l-5 5" fill="none" stroke="#ff4d4d" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="translate"
                        values="0,0; 4,0; 0,0" dur="1.6s"
                        calcMode="spline" keyTimes="0;0.5;1"
                        keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
    </path>

    <!-- the frame lights up with the banner 12s surge -->
    <rect x="1" y="1" width="438" height="228" rx="13" fill="none" stroke="#5a1414" stroke-width="1.5">
      <animate attributeName="stroke" values="#5a1414;#ff4040;#5a1414;#5a1414"
               keyTimes="0;.015;.12;1" dur="12s" repeatCount="indefinite"/>
    </rect>

    <!-- light running along the border -->
    <rect x="1" y="1" width="438" height="228" rx="13" fill="none" stroke="#ff4d4d"
          stroke-width="2" pathLength="100" stroke-dasharray="12 88" stroke-linecap="round"
          filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="6s"
               begin="-1.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
