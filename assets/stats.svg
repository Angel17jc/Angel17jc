<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250"
     role="img" aria-label="GitHub stats">
  <title>GitHub stats</title>
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="900" height="250" rx="16"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140606"/>
      <stop offset="1" stop-color="#050202"/>
    </linearGradient>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff2b2b" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a1414"/>
      <stop offset="1" stop-color="#ff4040"/>
    </linearGradient>
    <!-- shine running over the bars once filled -->
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="330" y1="0" x2="490" y2="0">
      <stop offset="0"   stop-color="#fff0f0" stop-opacity="0"/>
      <stop offset=".5"  stop-color="#fff0f0" stop-opacity=".55"/>
      <stop offset="1"   stop-color="#fff0f0" stop-opacity="0"/>
      <animate attributeName="x1" values="330;900" dur="3.2s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="490;1060" dur="3.2s" begin="1.8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="textGlow" x="-25%" y="-60%" width="150%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: Verdana, 'DejaVu Sans', sans-serif; }
    .h   { fill: #ffffff; font-size: 15px; font-weight: bold; letter-spacing: 2.4px; }
    .lbl { fill: #c9b8b8; font-size: 13px; }
    .num { fill: #ffffff; font-size: 15px; font-weight: bold; }
    .pct { fill: #ff8a8a; font-size: 12px; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="900" height="250" fill="url(#bg)"/>

    <!-- ember pulsing behind each column -->
    <ellipse cx="200" cy="140" rx="260" ry="150" fill="url(#ember)">
      <animate attributeName="opacity" values=".5;1;.5" dur="3.4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="680" cy="140" rx="260" ry="150" fill="url(#ember)" opacity=".6">
      <animate attributeName="opacity" values="1;.5;1" dur="3.4s" repeatCount="indefinite"/>
    </ellipse>

    <g filter="url(#textGlow)">
      <text x="40" y="48" class="h">ACTIVITY</text>
      <text x="490" y="48" class="h">TOP LANGUAGES</text>
    </g>
    <rect x="40" y="60" width="0" height="2" fill="#ff2f2f">
      <animate attributeName="width" values="0;370;370;0" keyTimes="0;.35;.8;1"
               dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="490" y="60" width="0" height="2" fill="#ff2f2f">
      <animate attributeName="width" values="0;370;370;0" keyTimes="0;.35;.8;1"
               dur="6s" begin="-3s" repeatCount="indefinite"/>
    </rect>

    <!-- vertical divider -->
    <rect x="449.5" y="40" width="1" height="170" fill="#ff2f2f" opacity=".25"/>

    <g opacity="0" transform="translate(-12 0)">
      <animate attributeName="opacity" to="1" dur=".5s" begin="0.15s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" to="0 0" dur=".5s"
                        begin="0.15s" fill="freeze" calcMode="spline" keyTimes="0;1"
                        keySplines=".2 .7 .3 1"/>
      <rect x="44" y="83" width="7" height="7" fill="#ff2f2f" transform="rotate(45 47.5 86.5)"/>
      <text x="64" y="92" class="lbl">Contributions (last year)</text>
      <text x="410" y="92" class="num" text-anchor="end">1,640</text>
    </g>
    <g opacity="0" transform="translate(-12 0)">
      <animate attributeName="opacity" to="1" dur=".5s" begin="0.27s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" to="0 0" dur=".5s"
                        begin="0.27s" fill="freeze" calcMode="spline" keyTimes="0;1"
                        keySplines=".2 .7 .3 1"/>
      <rect x="44" y="113" width="7" height="7" fill="#ff2f2f" transform="rotate(45 47.5 116.5)"/>
      <text x="64" y="122" class="lbl">Commits</text>
      <text x="410" y="122" class="num" text-anchor="end">524</text>
    </g>
    <g opacity="0" transform="translate(-12 0)">
      <animate attributeName="opacity" to="1" dur=".5s" begin="0.39s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" to="0 0" dur=".5s"
                        begin="0.39s" fill="freeze" calcMode="spline" keyTimes="0;1"
                        keySplines=".2 .7 .3 1"/>
      <rect x="44" y="143" width="7" height="7" fill="#ff2f2f" transform="rotate(45 47.5 146.5)"/>
      <text x="64" y="152" class="lbl">Pull requests</text>
      <text x="410" y="152" class="num" text-anchor="end">10</text>
    </g>
    <g opacity="0" transform="translate(-12 0)">
      <animate attributeName="opacity" to="1" dur=".5s" begin="0.51s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" to="0 0" dur=".5s"
                        begin="0.51s" fill="freeze" calcMode="spline" keyTimes="0;1"
                        keySplines=".2 .7 .3 1"/>
      <rect x="44" y="173" width="7" height="7" fill="#ff2f2f" transform="rotate(45 47.5 176.5)"/>
      <text x="64" y="182" class="lbl">Public repos</text>
      <text x="410" y="182" class="num" text-anchor="end">14</text>
    </g>
    <g opacity="0" transform="translate(-12 0)">
      <animate attributeName="opacity" to="1" dur=".5s" begin="0.63s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" to="0 0" dur=".5s"
                        begin="0.63s" fill="freeze" calcMode="spline" keyTimes="0;1"
                        keySplines=".2 .7 .3 1"/>
      <rect x="44" y="203" width="7" height="7" fill="#ff2f2f" transform="rotate(45 47.5 206.5)"/>
      <text x="64" y="212" class="lbl">Stars</text>
      <text x="410" y="212" class="num" text-anchor="end">1</text>
    </g>

    <text x="490" y="92" class="lbl">TypeScript</text>
    <text x="860" y="92" class="pct" text-anchor="end">57.2%</text>
    <rect x="490" y="100" width="370" height="6" rx="3" fill="#2a0e0e"/>
    <rect x="490" y="100" width="0" height="6" rx="3" fill="url(#bar)">
      <animate attributeName="width" to="370.0" dur="1.1s" begin="0.40s" fill="freeze"
               calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .3 1"/>
    </rect>
    <rect x="490" y="100" width="0" height="6" rx="3" fill="url(#sweep)">
      <animate attributeName="width" to="370.0" dur="1.1s" begin="0.40s" fill="freeze"
               calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .3 1"/>
    </rect>
    <text x="490" y="122" class="lbl">Python</text>
    <text x="860" y="122" class="pct" text-anchor="end">18.3%</text>
    <rect x="490" y="130" width="370" height="6" rx="3" fill="#2a0e0e"/>
    <rect x="490" y="130" width="0" height="6" rx="3" fill="url(#bar)">
      <animate attributeName="width" to="118.1" dur="1.1s" begin="0.55s" fill="freeze"
               calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .3 1"/>
    </rect>
    <rect x="490" y="130" width="0" height="6" rx="3" fill="url(#sweep)">
      <animate attributeName="width" to="118.1" dur="1.1s" begin="0.55s" fill="freeze"
               calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .3 1"/>
    </rect>
    <text x="490" y="152" class="lbl">Java</text>
    <text x="860" y="152" class="pct" text-anchor="end">13.3%</text>
    <rect x="490" y="160" width="370" height="6" rx="3" fill="#2a0e0e"/>
    <rect x="490" y="160" width="0" height="6" rx="3" fill="url(#bar)">
      <animate attributeName="width" to="86.2" dur="1.1s" begin="0.70s" fill="freeze"
               calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .3 1"/>
    </rect>
    <rect x="490" y="160" width="0" height="6" rx="3" fill="url(#sweep)">
      <animate attributeName="width" to="86.2" dur="1.1s" begin="0.70s" fill="freeze"
               calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .3 1"/>
    </rect>
    <text x="490" y="182" class="lbl">Kotlin</text>
    <text x="860" y="182" class="pct" text-anchor="end">5.2%</text>
    <rect x="490" y="190" width="370" height="6" rx="3" fill="#2a0e0e"/>
    <rect x="490" y="190" width="0" height="6" rx="3" fill="url(#bar)">
      <animate attributeName="width" to="33.6" dur="1.1s" begin="0.85s" fill="freeze"
               calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .3 1"/>
    </rect>
    <rect x="490" y="190" width="0" height="6" rx="3" fill="url(#sweep)">
      <animate attributeName="width" to="33.6" dur="1.1s" begin="0.85s" fill="freeze"
               calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .3 1"/>
    </rect>
    <text x="490" y="212" class="lbl">PLpgSQL</text>
    <text x="860" y="212" class="pct" text-anchor="end">4.8%</text>
    <rect x="490" y="220" width="370" height="6" rx="3" fill="#2a0e0e"/>
    <rect x="490" y="220" width="0" height="6" rx="3" fill="url(#bar)">
      <animate attributeName="width" to="31.1" dur="1.1s" begin="1.00s" fill="freeze"
               calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .3 1"/>
    </rect>
    <rect x="490" y="220" width="0" height="6" rx="3" fill="url(#sweep)">
      <animate attributeName="width" to="31.1" dur="1.1s" begin="1.00s" fill="freeze"
               calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .3 1"/>
    </rect>

    <!-- the frame lights up with the banner 12s surge -->
    <rect width="900" height="250" fill="#ff5252" opacity="0">
      <animate attributeName="opacity" values="0;.08;0;0" keyTimes="0;.012;.07;1"
               dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect width="900" height="250" fill="none" stroke="#7a1414" stroke-width="2" rx="16">
      <animate attributeName="stroke" values="#7a1414;#ff4040;#7a1414;#7a1414"
               keyTimes="0;.015;.12;1" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
