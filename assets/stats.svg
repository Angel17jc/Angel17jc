<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350"
     role="img" aria-label="GitHub stats">
  <title>GitHub stats</title>
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="900" height="350" rx="16"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140606"/>
      <stop offset="1" stop-color="#050202"/>
    </linearGradient>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff2b2b" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a1414"/>
      <stop offset="1" stop-color="#ff4040"/>
    </linearGradient>
    <!-- shine running over the bars once filled -->
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="330" y1="0" x2="490" y2="0">
      <stop offset="0"   stop-color="#fff0f0" stop-opacity="0"/>
      <stop offset=".5"  stop-color="#fff0f0" stop-opacity=".55"/>
      <stop offset="1"   stop-color="#fff0f0" stop-opacity="0"/>
      <animate attributeName="x1" values="330;900" dur="3.2s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="490;1060" dur="3.2s" begin="1.8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="split" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"  stop-color="#ff2f2f" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff2f2f" stop-opacity=".45"/>
      <stop offset="1"  stop-color="#ff2f2f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff2f2f"/>
      <stop offset="1" stop-color="#ffb08a"/>
    </linearGradient>
    <filter id="textGlow" x="-25%" y="-60%" width="150%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: Verdana, 'DejaVu Sans', sans-serif; }
    .h   { fill: #ffffff; font-size: 15px; font-weight: bold; letter-spacing: 2.4px; }
    .lbl { fill: #c9b8b8; font-size: 13px; }
    .num { fill: #ffffff; font-size: 15px; font-weight: bold; }
    .pct { fill: #ff8a8a; font-size: 12px; }
    .big { fill: #ffffff; font-size: 30px; font-weight: bold; }
    .unit { fill: #ff8a8a; font-size: 11px; }
    .cap { fill: #c9b8b8; font-size: 11px; font-weight: bold; letter-spacing: 1.6px; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="900" height="350" fill="url(#bg)"/>

    <!-- ember pulsing behind each column -->
    <ellipse cx="200" cy="140" rx="260" ry="150" fill="url(#ember)">
      <animate attributeName="opacity" values=".5;1;.5" dur="3.4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="680" cy="140" rx="260" ry="150" fill="url(#ember)" opacity=".6">
      <animate attributeName="opacity" values="1;.5;1" dur="3.4s" repeatCount="indefinite"/>
    </ellipse>

    <g filter="url(#textGlow)">
      <text x="40" y="48" class="h">ACTIVITY</text>
      <text x="490" y="48" class="h">TOP LANGUAGES</text>
    </g>
    <rect x="40" y="60" width="0" height="2" fill="#ff2f2f">
      <animate attributeName="width" values="0;370;370;0" keyTimes="0;.35;.8;1"
               dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="490" y="60" width="0" height="2" fill="#ff2f2f">
      <animate attributeName="width" values="0;370;370;0" keyTimes="0;.35;.8;1"
               dur="6s" begin="-3s" repeatCount="indefinite"/>
    </rect>

    <!-- vertical divider -->
    <rect x="449.5" y="40" width="1" height="170" fill="#ff2f2f" opacity=".25"/>

    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.231;1" dur="0.65s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-12 0;-12 0;0 0" keyTimes="0;0.231;1"
                        dur="0.65s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;.2 .7 .3 1"/>
      <rect x="44" y="83" width="7" height="7" fill="#ff2f2f" transform="rotate(45 47.5 86.5)"/>
      <text x="64" y="92" class="lbl">Contributions (last year)</text>
      <text x="410" y="92" class="num" text-anchor="end">1,795</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.351;1" dur="0.77s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-12 0;-12 0;0 0" keyTimes="0;0.351;1"
                        dur="0.77s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;.2 .7 .3 1"/>
      <rect x="44" y="113" width="7" height="7" fill="#ff2f2f" transform="rotate(45 47.5 116.5)"/>
      <text x="64" y="122" class="lbl">Commits</text>
      <text x="410" y="122" class="num" text-anchor="end">556</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.438;1" dur="0.89s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-12 0;-12 0;0 0" keyTimes="0;0.438;1"
                        dur="0.89s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;.2 .7 .3 1"/>
      <rect x="44" y="143" width="7" height="7" fill="#ff2f2f" transform="rotate(45 47.5 146.5)"/>
      <text x="64" y="152" class="lbl">Pull requests</text>
      <text x="410" y="152" class="num" text-anchor="end">21</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.505;1" dur="1.01s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-12 0;-12 0;0 0" keyTimes="0;0.505;1"
                        dur="1.01s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;.2 .7 .3 1"/>
      <rect x="44" y="173" width="7" height="7" fill="#ff2f2f" transform="rotate(45 47.5 176.5)"/>
      <text x="64" y="182" class="lbl">Public repos</text>
      <text x="410" y="182" class="num" text-anchor="end">14</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.558;1" dur="1.13s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-12 0;-12 0;0 0" keyTimes="0;0.558;1"
                        dur="1.13s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;.2 .7 .3 1"/>
      <rect x="44" y="203" width="7" height="7" fill="#ff2f2f" transform="rotate(45 47.5 206.5)"/>
      <text x="64" y="212" class="lbl">Stars</text>
      <text x="410" y="212" class="num" text-anchor="end">1</text>
    </g>

    <text x="490" y="92" class="lbl">TypeScript</text>
    <text x="860" y="92" class="pct" text-anchor="end">59.6%</text>
    <rect x="490" y="100" width="370" height="6" rx="3" fill="#2a0e0e"/>
    <rect x="490" y="100" width="370.0" height="6" rx="3" fill="url(#bar)">
      <animate attributeName="width" values="0;0;370.0" keyTimes="0;0.267;1" dur="1.50s" fill="freeze"
               calcMode="spline" keySplines="0 0 1 1;.2 .7 .3 1"/>
    </rect>
    <rect x="490" y="100" width="370.0" height="6" rx="3" fill="url(#sweep)">
      <animate attributeName="width" values="0;0;370.0" keyTimes="0;0.267;1" dur="1.50s" fill="freeze"
               calcMode="spline" keySplines="0 0 1 1;.2 .7 .3 1"/>
    </rect>
    <text x="490" y="122" class="lbl">Python</text>
    <text x="860" y="122" class="pct" text-anchor="end">17.2%</text>
    <rect x="490" y="130" width="370" height="6" rx="3" fill="#2a0e0e"/>
    <rect x="490" y="130" width="106.5" height="6" rx="3" fill="url(#bar)">
      <animate attributeName="width" values="0;0;106.5" keyTimes="0;0.333;1" dur="1.65s" fill="freeze"
               calcMode="spline" keySplines="0 0 1 1;.2 .7 .3 1"/>
    </rect>
    <rect x="490" y="130" width="106.5" height="6" rx="3" fill="url(#sweep)">
      <animate attributeName="width" values="0;0;106.5" keyTimes="0;0.333;1" dur="1.65s" fill="freeze"
               calcMode="spline" keySplines="0 0 1 1;.2 .7 .3 1"/>
    </rect>
    <text x="490" y="152" class="lbl">Java</text>
    <text x="860" y="152" class="pct" text-anchor="end">12.5%</text>
    <rect x="490" y="160" width="370" height="6" rx="3" fill="#2a0e0e"/>
    <rect x="490" y="160" width="77.7" height="6" rx="3" fill="url(#bar)">
      <animate attributeName="width" values="0;0;77.7" keyTimes="0;0.389;1" dur="1.80s" fill="freeze"
               calcMode="spline" keySplines="0 0 1 1;.2 .7 .3 1"/>
    </rect>
    <rect x="490" y="160" width="77.7" height="6" rx="3" fill="url(#sweep)">
      <animate attributeName="width" values="0;0;77.7" keyTimes="0;0.389;1" dur="1.80s" fill="freeze"
               calcMode="spline" keySplines="0 0 1 1;.2 .7 .3 1"/>
    </rect>
    <text x="490" y="182" class="lbl">Kotlin</text>
    <text x="860" y="182" class="pct" text-anchor="end">4.9%</text>
    <rect x="490" y="190" width="370" height="6" rx="3" fill="#2a0e0e"/>
    <rect x="490" y="190" width="30.3" height="6" rx="3" fill="url(#bar)">
      <animate attributeName="width" values="0;0;30.3" keyTimes="0;0.436;1" dur="1.95s" fill="freeze"
               calcMode="spline" keySplines="0 0 1 1;.2 .7 .3 1"/>
    </rect>
    <rect x="490" y="190" width="30.3" height="6" rx="3" fill="url(#sweep)">
      <animate attributeName="width" values="0;0;30.3" keyTimes="0;0.436;1" dur="1.95s" fill="freeze"
               calcMode="spline" keySplines="0 0 1 1;.2 .7 .3 1"/>
    </rect>
    <text x="490" y="212" class="lbl">PLpgSQL</text>
    <text x="860" y="212" class="pct" text-anchor="end">4.6%</text>
    <rect x="490" y="220" width="370" height="6" rx="3" fill="#2a0e0e"/>
    <rect x="490" y="220" width="28.7" height="6" rx="3" fill="url(#bar)">
      <animate attributeName="width" values="0;0;28.7" keyTimes="0;0.476;1" dur="2.10s" fill="freeze"
               calcMode="spline" keySplines="0 0 1 1;.2 .7 .3 1"/>
    </rect>
    <rect x="490" y="220" width="28.7" height="6" rx="3" fill="url(#sweep)">
      <animate attributeName="width" values="0;0;28.7" keyTimes="0;0.476;1" dur="2.10s" fill="freeze"
               calcMode="spline" keySplines="0 0 1 1;.2 .7 .3 1"/>
    </rect>

    <!-- streaks: a faint line splits them from the columns above -->
    <rect x="40" y="244" width="820" height="1" fill="url(#split)"/>
    <rect x="299.5" y="262" width="1" height="72" fill="#ff2f2f" opacity=".2"/>
    <rect x="599.5" y="262" width="1" height="72" fill="#ff2f2f" opacity=".2"/>

    <!-- flame next to the current streak, flickering -->
    <g transform="translate(114 281)">
      <path d="M0 -15 C7 -6 11 1 7 9 C5 13 -5 13 -7 9 C-10 2 -5 -3 0 -15 Z" fill="url(#flame)"
            filter="url(#textGlow)">
        <animateTransform attributeName="transform" type="scale"
                          values="1 1;.94 1.08;1.04 .96;1 1" dur="1.3s" repeatCount="indefinite"/>
      </path>
      <path d="M0 -3 C3 1 4 4 2 8 C1 10 -1 10 -2 8 C-4 5 -2 2 0 -3 Z" fill="#fff0e0" opacity=".85">
        <animate attributeName="opacity" values=".85;.5;.9;.85" dur=".9s" repeatCount="indefinite"/>
      </path>
    </g>

    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.600;1" dur="1.50s" fill="freeze"/>
      <text x="150" y="292" class="big" text-anchor="middle" filter="url(#textGlow)">4</text>
      <text x="150" y="312" class="unit" text-anchor="middle">days</text>
      <text x="150" y="332" class="cap" text-anchor="middle">CURRENT STREAK</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.636;1" dur="1.65s" fill="freeze"/>
      <text x="450" y="292" class="big" text-anchor="middle" filter="url(#textGlow)">19</text>
      <text x="450" y="312" class="unit" text-anchor="middle">days</text>
      <text x="450" y="332" class="cap" text-anchor="middle">LONGEST STREAK</text>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.667;1" dur="1.80s" fill="freeze"/>
      <text x="750" y="292" class="big" text-anchor="middle" filter="url(#textGlow)">112</text>
      <text x="750" y="312" class="unit" text-anchor="middle">contributions</text>
      <text x="750" y="332" class="cap" text-anchor="middle">MOST IN A DAY</text>
    </g>

    <!-- the frame lights up with the banner 12s surge -->
    <rect width="900" height="350" fill="#ff5252" opacity="0">
      <animate attributeName="opacity" values="0;.08;0;0" keyTimes="0;.012;.07;1"
               dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect width="900" height="350" fill="none" stroke="#7a1414" stroke-width="2" rx="16">
      <animate attributeName="stroke" values="#7a1414;#ff4040;#7a1414;#7a1414"
               keyTimes="0;.015;.12;1" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
