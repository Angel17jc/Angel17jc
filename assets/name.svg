<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 104" width="620" height="104"
     role="img" aria-label="Angel Conforme">
  <title>Angel Conforme</title>
  <defs>
    <!-- brillo que barre las letras de izquierda a derecha -->
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="-40" y2="0">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#ffffff"/>
      <stop offset="0.5"  stop-color="#ff7a7a"/>
      <stop offset="0.58" stop-color="#ffffff"/>
      <stop offset="1"    stop-color="#ffffff"/>
      <animate attributeName="x1" from="-300" to="620" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="-40"  to="880" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="soft" x="-40%" y="-100%" width="180%" height="320%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <g>
    <!-- flotacion suave: el mismo respirar que el retrato del banner -->
    <animateTransform attributeName="transform" type="translate"
                      values="0,0; 0,-3.5; 0,0" dur="5.5s"
                      calcMode="spline" keyTimes="0;0.5;1"
                      keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>

  <!-- resplandor rojo latiendo por detras -->
  <text x="310" y="58" text-anchor="middle" filter="url(#soft)"
        font-family="Verdana,DejaVu Sans,sans-serif" font-size="42"
        font-weight="bold" letter-spacing="3" fill="#ff1e1e" opacity=".45">ANGEL CONFORME
    <animate attributeName="opacity" values=".28;.7;.28" dur="3.4s" repeatCount="indefinite"/>
  </text>

  <!-- nombre con el barrido de brillo -->
  <text x="310" y="58" text-anchor="middle"
        font-family="Verdana,DejaVu Sans,sans-serif" font-size="42"
        font-weight="bold" letter-spacing="3" fill="url(#shine)">ANGEL CONFORME</text>

  <!-- subrayado que se dibuja y se recoge -->
  <rect x="310" y="76" width="0" height="2" fill="#ff2f2f">
    <animate attributeName="width" values="0;360;360;0" keyTimes="0;.35;.8;1"
             dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="310;130;130;310" keyTimes="0;.35;.8;1"
             dur="6s" repeatCount="indefinite"/>
  </rect>
  </g>
</svg>
