name: Generate 3D Contributions

on:
  # Runs automatically every 24 hours
  schedule:
    - cron: "0 1 * * *"

  # Allows running it manually
  workflow_dispatch:

  # Rebuilds the graph when the colors change
  push:
    branches: [main]
    paths:
      - .github/3d-contrib.json

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Colors live in .github/3d-contrib.json (light theme + darkMode)
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/3d-contrib.json

      # Only commits if the graph changed; retries the push in case
      # another workflow pushed in the meantime
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          git diff --cached --quiet && exit 0
          git commit -m "chore: update 3D contributions"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
