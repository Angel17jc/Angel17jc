name: Generate Stats Card

on:
  # Runs automatically every 24 hours
  schedule:
    - cron: "30 0 * * *"

  # Allows running it manually
  workflow_dispatch:

  # Rebuilds the card when the script changes
  push:
    branches: [main]
    paths:
      - assets/build_stats.py

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build assets/stats.svg
        run: python3 assets/build_stats.py "${{ github.repository_owner }}" assets/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only commits if the numbers changed
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet || (git commit -m "chore: update stats.svg" && git push)
