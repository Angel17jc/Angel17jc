name: Generate Snake

on:
  # Runs automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *" 
  
  # Allows running it manually
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: Platane/snk@v3
        with:
          # Your GitHub username
          github_user_name: ${{ github.repository_owner }}
          # Files it generates (one dark, one light), using the banner reds.
          # color_dots goes from "no contributions" to "most contributions".
          outputs: |
            dist/github-snake.svg?color_snake=#c41e1e&color_dots=#ebedf0,#ffc9c9,#ff8a8a,#e03131,#9b1010
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff6b6b&color_dots=#161b22,#4a0d0d,#7a1414,#c41e1e,#ff2f2f

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
